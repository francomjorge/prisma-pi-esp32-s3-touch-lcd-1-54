name: B7 ESP-IDF build

on:
  push:
    branches: [ b7-web-admin ]
  pull_request:
    branches: [ b6-prisma-ap ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build B7 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
