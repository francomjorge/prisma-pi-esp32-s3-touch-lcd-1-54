name: B5 ESP-IDF build

on:
  push:
    branches: [ b5-wifi-sta ]
  pull_request:
    branches: [ b4-storage-tf ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build B5 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
