name: B4 ESP-IDF build

on:
  push:
    branches: [ b4-storage-tf ]
  pull_request:
    branches: [ b3-imu-sensors ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build B4 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
