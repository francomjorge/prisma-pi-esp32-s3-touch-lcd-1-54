name: B3 ESP-IDF build

on:
  push:
    branches: [ b3-imu-sensors ]
  pull_request:
    branches: [ b2-audio ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build B3 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
